name: Screener Minervini Diario

on:
  schedule:
    # Se ejecuta de Lunes a Viernes a las 22:30 UTC (17:30 / 18:30 hora Chile / NY)
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde un botón cuando quieras

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Screener
        run: python screener.py

      - name: Guardar y publicar CSV actualizado
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add oportunidades_minervini_filtradas.csv || true
          git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 0
          git push
